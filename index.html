<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Saldo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="mobile-header">
    <span class="logo">Gerenciador</span>
    <button class="hamburger" id="hamburger">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </button>
</div>

<div class="app-layout">

    <div class="left-panel">
        <div class="progress-section">
            <div class="progress-labels">
                <span>Progresso da Meta</span>
                <span>Alvo: R$ 12.000,00</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar">0%</div>
            </div>
        </div>

        <div class="balance-display">
            <h2>Saldo Atual</h2>
            <div class="value" id="balanceDisplay">R$ 0,00</div>
        </div>

        <div class="history-section">
            <h3>Histórico de Movimentação</h3>
            <ul class="history-list" id="historyList"></ul>
        </div>
    </div>

    <div class="right-panel" id="rightPanel">
        <h3>Movimentação</h3>
        <input type="number" id="amountInput" placeholder="Valor (R$)" min="0" step="0.01">
        <button class="btn-add" id="btnAdd">+ Adicionar</button>
        <button class="btn-sub" id="btnSub">- Subtrair</button>
    </div>

</div>

<script src="js/script.js"></script>
</body>
</html>
