<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Saldo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<script>
// Verifica se está logado
if (!localStorage.getItem("logado")) {
    window.location.href = "/login-page";
}
</script>

<body>

<div class="mobile-header">
    <span class="logo">Gerenciador</span>
    <button class="hamburger" id="hamburger">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </button>
</div>

<div class="app-layout">

    <div class="left-panel">
        <div class="progress-section">
            <div class="progress-labels">
                <span>Progresso da Meta</span>
                <span>Alvo: R$ 12.000,00</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar">0%</div>
            </div>
        </div>

        <div class="balance-display">
            <h2>Saldo Atual</h2>
            <div class="value" id="balanceDisplay">R$ 0,00</div>
        </div>

        <div class="history-section">
            <h3>Histórico de Movimentação</h3>
            <ul class="history-list" id="historyList"></ul>
        </div>
    </div>

    <div class="right-panel" id="rightPanel">
        <h3>Movimentação</h3>
        <input type="number" id="amountInput" placeholder="Valor (R$)" min="0" step="0.01">
        <button class="btn-add" id="btnAdd">+ Adicionar</button>
        <button class="btn-sub" id="btnSub">- Subtrair</button>
    </div>

</div>

<div id="modalSub" class="modal-overlay hidden">
    <div class="modal-content">
        <h3>Motivo da Retirada</h3>
        <p>Para onde foi esse dinheiro?</p>
        
        <input type="text" id="modalReasonInput" placeholder="Ex: Conta de Luz, Mercado..." autocomplete="off">
        
        <div class="modal-actions">
            <button id="btnCancelModal" class="btn-cancel">Cancelar</button>
            <button id="btnConfirmModal" class="btn-confirm">Confirmar Saída</button>
        </div>
    </div>
</div>

<div id="modalError" class="modal-overlay hidden">
    <div class="modal-content">
        <h3 style="color: #e84118;">⚠️ Atenção</h3>
        <p id="errorMessage">Algo deu errado!</p>
        
        <div class="modal-actions">
            <button id="btnErrorOk" class="btn-confirm" style="width: 100%;">Entendido</button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
